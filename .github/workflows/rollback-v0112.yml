name: rollback-v0112
# ============================================================
# بازگشت کنترل‌شدهٔ نوبتیار به v0.11.1 (b1a5d39…) — فقط در صورت شکست انتشار.
#  - فقط release جدید لیارا از سورس b1a5d39 ساخته می‌شود (کد تولید برمی‌گردد)؛
#  - مخزن و main روی GitHub دست‌نخورده می‌مانند؛
#  - پایگاه داده دست‌نخورده می‌ماند (در v0.11.2 مهاجرتِ ویرانگر وجود ندارد)؛
#  - SECRET_KEY تعویض نمی‌شود — نشست‌های موجود معتبر می‌مانند؛
#  - در پایان راستی‌آزمایی با EXPECTED_VERSION=0.11.1 (exit 1 در شکست).
#
# اجرا: Actions → rollback-v0112 → Run workflow → مقدار confirm = ROLLBACK
#       یا: gh workflow run rollback-v0112.yml --ref feat/security-design-v0.11.2 -f confirm=ROLLBACK
# پیش‌نیاز: Secret ریپو LIARA_API_KEY
# ============================================================
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "برای تأیید بازگشت، عیناً ROLLBACK را وارد کنید"
        required: true
        default: ""

permissions:
  contents: read   # هیچ pushی لازم نیست — کمینه‌ترین سطح

concurrency:
  group: nobatyar-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ROLLBACK_SHA: b1a5d39ad7f1ad0bce74c8fb4d87c710f9e11fbd
      LIARA_TOKEN: ${{ secrets.LIARA_API_KEY || secrets.LIARA_API_TOKEN }}
    steps:
      - name: گارد تأیید و قالب SHA بازگشت
        env:
          CONFIRM: ${{ inputs.confirm }}   # ارجاع با env — بدون تزریق متن ورودی به شل
        run: |
          [ "$CONFIRM" = "ROLLBACK" ] || { echo "PHASE_GUARD: FAILED reason=برای-تأیید-باید-عیناً-ROLLBACK-وارد-شود"; exit 1; }
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "PHASE_GUARD: FAILED reason=ROLLBACK_SHA-باید-SHA-کامل-باشد"; exit 1; }
          [ -n "$LIARA_TOKEN" ] || { echo "PHASE_GUARD: FAILED reason=Secret-ریپویی-LIARA_API_KEY-ثبت-نشده-است"; exit 1; }
          echo "PHASE_GUARD: OK"

      # اکشن رسمی گیت‌هاب، پین‌شده به SHA مشخص (v4.4.0).
      # persist-credentials: false — هیچ pushی در بازگشت لازم نیست؛ بنابراین توکن
      # GITHUB_TOKEN اصلاً در .git/config ذخیره نمی‌شود و workspace بدون اعتبار می‌ماند.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ذخیرهٔ ابزار ci و رفتن به کامیت v0.11.1 (با تأیید HEAD)
        run: |
          cp -r ci /tmp/ci-toolkit
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          git checkout --detach "$ROLLBACK_SHA"
          ACTUAL=$(git rev-parse HEAD)
          [ "$ACTUAL" = "$ROLLBACK_SHA" ] || { echo "PHASE_CHECKOUT: FAILED reason=HEAD=$ACTUAL-برابر-ROLLBACK_SHA-نیست"; exit 1; }
          echo "PHASE_CHECKOUT: OK detached@$ACTUAL"

      - name: بستهٔ سورس v0.11.1 + گارد نشت بسته
        run: |
          cd backend
          tar --exclude='__pycache__' --exclude='*.pyc' --exclude='.venv*' \
              --exclude='.git' --exclude='.env' --exclude='.env.*' \
              -czf /tmp/liara_source.tar.gz .
          cd "$GITHUB_WORKSPACE"
          if tar -tzf /tmp/liara_source.tar.gz | grep -E '(^|/)\.git(/|$)|(^|/)\.env'; then
            echo "PHASE_PACKAGE: FAILED reason=.git-یا-.env-داخل-بسته-است"; exit 1
          fi
          rm -rf /tmp/archcheck && mkdir -p /tmp/archcheck
          tar -xzf /tmp/liara_source.tar.gz -C /tmp/archcheck
          if grep -rIlnE 'ghs_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|extraheader|AUTHORIZATION: basic' /tmp/archcheck > /tmp/leak_hits.txt; then
            echo "PHASE_PACKAGE: FAILED reason=الگوی-اعتبار-داخل-بسته-یافت-شد"
            head -5 /tmp/leak_hits.txt
            rm -rf /tmp/archcheck /tmp/leak_hits.txt
            exit 1
          fi
          rm -rf /tmp/archcheck /tmp/leak_hits.txt
          echo "PHASE_PACKAGE: OK (گارد نشت بسته سبز است)"

      - name: دیپلوی بازگشت روی لیارا
        run: |
          RELEASE_MESSAGE="Rollback نوبتیار به v0.11.1 (${ROLLBACK_SHA}) — بازگشت کنترل‌شده پس از انتشار ناموفق v0.11.2؛ پایگاه داده و SECRET_KEY دست‌نخورده" \
          DEPLOY_REPO="$GITHUB_WORKSPACE" \
          python3 /tmp/ci-toolkit/deploy_liara.py
          echo "PHASE_DEPLOY: OK"

      - name: راستی‌آزمایی بازگشت به 0.11.1 (exit 1 در شکست)
        run: |
          sleep 20
          if VERIFY_EXPECTED_VERSION=0.11.1 bash /tmp/ci-toolkit/postdeploy_verify.sh; then
            echo "PHASE_VERIFY: OK (تولید به v0.11.1 بازگشت و تأیید شد)"
          else
            echo "PHASE_VERIFY: FAILED — بازگشت تأیید نمی‌شود؛ فوراً وضعیت لیارا بررسی شود"
            exit 1
          fi

      - name: خلاصهٔ بازگشت
        if: always()
        run: |
          {
            echo "## خلاصهٔ Rollback نوبتیار"
            echo ""
            echo "| مورد | مقدار |"
            echo "| --- | --- |"
            echo "| نسخهٔ تولید پس از بازگشت | **0.11.1** (در صورت سبز بودن راستی‌آزمایی) |"
            echo "| main روی GitHub | در v0.11.2 باقی مانده است (مطابق طرح بازگشت ممیزی‌شده) |"
            echo "| پایگاه داده | دست‌نخورده (بکاپ‌های رمزنگاری‌شده حفظ شدند) |"
            echo "| SECRET_KEY | دست‌نخورده — نشست‌های موجود معتبر می‌مانند |"
            echo ""
            echo "پس از رفع علت شکست، انتشار با workflow «release-v0112» از سر گرفته می‌شود."
          } >> "$GITHUB_STEP_SUMMARY"
