name: pilot-tests

on:
  push:
    branches:
      - ci/pilot-postgres-tests
      - fix/commercial-readiness-v0.17.0
      - feat/three-portal-redesign
      - feat/appointment-receipt-reference
      - feat/appt-reminder-push-v0.17.0
  pull_request:
    branches:
      - main
      - ci/pilot-postgres-tests
      - fix/commercial-readiness-v0.17.0
      - feat/three-portal-redesign
      - feat/appointment-receipt-reference
      - feat/appt-reminder-push-v0.17.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nobatyar-pilot-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout (SHA pinned; read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12 (SHA pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run SQLite and PostgreSQL test suite
        env:
          NOBATYAR_TEST_PG_URI: postgresql://postgres@127.0.0.1:5432/postgres
          WAITLIST_RACE_ROUNDS: "100"
        run: bash run_tests.sh
