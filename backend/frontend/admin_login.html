<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود ادمین | نوبتیار</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/favicon-256.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/Vazirmatn-Regular.woff2?v=0111" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css?v=0111">

  <!-- Google tag (gtag.js) — Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NVWBWMF1E4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NVWBWMF1E4');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand-inline"><picture><source type="image/webp" srcset="/static/img/nobatyar-mark.webp"><img src="/static/img/nobatyar-mark.png" alt="لوگوی رسمی نوبتیار" class="brand-mark"></picture><span class="brand-text"><b>نوبتیار</b><small><h1>ادمین</h1></small></span></div>
      <nav><a href="/">خانه</a></nav>
    </div>
  </header>
  <main class="container">
    <div class="card" style="max-width: 400px; margin: 2rem auto;">
      <h2>ورود ادمین</h2>
      <div id="msg"></div>
      <form id="loginForm">
        <label>نام کاربری</label>
        <input type="text" name="username" required value="admin">
        <label>رمز عبور</label>
        <input type="password" name="password" required>
        <button type="submit">ورود</button>
      </form>
    </div>
  </main>
  <script>
    // ضد XSS: جزئیات خطا هرگز مستقیم innerHTML نمی‌شود (v0.9.2)
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value })
      });
      const json = await res.json();
      if (!res.ok) {
        const t = (json && Array.isArray(json.detail)) ? 'مقادیر ارسالی نامعتبر است'
          : esc((json && json.detail) || 'خطا');
        document.getElementById('msg').innerHTML = `<div class="alert alert-error">${t}</div>`;
        return;
      }
      localStorage.setItem('admin_token', json.access_token);
      // بازیابی امن: پس از ورود با رمز موقت، پنل مودال اجباری تغییر رمز را نشان می‌دهد
      if (json.must_change_password) {
        window.location.href = '/admin/panel#must-change';
      } else {
        window.location.href = '/admin/panel';
      }
    });
  </script>
</body>
</html>
