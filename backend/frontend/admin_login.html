<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var f=location.search.indexOf('app=1')>-1||window.NOBATYAR_APP===true||(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());if(f){document.documentElement.classList.add('app-mode');document.addEventListener('click',function(ev){try{var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;if(!a)return;var href=a.getAttribute('href')||'';if(!href||href.charAt(0)!=='/'||href.charAt(1)==='/'||href.indexOf('app=1')>-1||href.indexOf(':')>-1)return;a.setAttribute('href',href+(href.indexOf('?')>-1?'&app=1':'?app=1'));}catch(e){}},true);}}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>ورود ادمین | نوبتیار</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/favicon-256.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/Vazirmatn-Regular.woff2?v=0140" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css?v=0161">
  <link rel="stylesheet" href="/static/css/portal-redesign.css?v=0172">

</head>
<body class="portal-body portal-admin portal-private portal-auth-page">
  <!-- v0.16.0: نوار بالای native اپ — فقط داخل WebView اپ نمایش داده می‌شود -->
  <div id="app-topbar" class="app-topbar">
    <img src="/static/img/favicon-64.png" alt="لوگوی نوبتیار" class="app-topbar-mark" width="30" height="30">
    <span class="app-topbar-title" id="appTopbarTitle">نوبتیار</span>
  </div>
  <script>(function(){function s(){try{var el=document.getElementById('appTopbarTitle');if(!el)return;var m={'/':'خانه','/book':'رزرو نوبت','/contact':'تماس با ما','/specialties':'تخصص‌ها','/magazine':'مجله سلامت','/about':'دربارهٔ نوبتیار','/faq':'پرسش‌های متداول','/complaints':'شکایات و پیگیری','/partners':'همکاری با ما','/register':'ثبت‌نام مراکز','/terms':'قوانین استفاده','/privacy':'حریم خصوصی','/cancellation':'لغو و تغییر نوبت','/admin/login':'ورود مدیر','/admin/panel':'پنل مدیریت','/clinic/login':'ورود مرکز','/clinic/panel':'پنل مرکز'};var h=location.pathname.replace(/\/+$/,'')||'/';var n=m[h]||'';if(!n){var h1=document.querySelector('main h1, h1');n=(h1&&h1.textContent||'').trim();}if(!n){var t=document.title||'نوبتیار';var i=t.indexOf('|');n=(i>-1?t.slice(0,i):t).trim()||'نوبتیار';}el.textContent=n;}catch(e){}}if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',s);}else{s();}})();</script>
  <header class="portal-header">
    <div class="container portal-header-inner">
      <a href="/" class="portal-brand" aria-label="نوبتیار"><img src="/static/img/nobatyar-mark.webp" alt=""><span class="portal-brand-copy"><strong>نوبتیار</strong><small>سامانهٔ مدیریت داخلی</small></span></a>
      <a class="portal-return" href="/">بازگشت به سایت عمومی</a>
    </div>
  </header>
  <main class="container portal-auth-main">
    <div class="card portal-auth-card">
      <h1>ورود ادمین</h1>
      <div id="msg"></div>
      <form id="loginForm">
        <label for="adminUser">نام کاربری</label>
        <input type="text" id="adminUser" name="username" required autocomplete="username">
        <label for="adminPass">رمز عبور</label>
        <input type="password" id="adminPass" name="password" required>
        <button type="submit">ورود</button>
      </form>
    </div>
  </main>
  <script>
    // ضد XSS: جزئیات خطا هرگز مستقیم innerHTML نمی‌شود (v0.9.2)
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value })
      });
      const json = await res.json();
      if (!res.ok) {
        const t = (json && Array.isArray(json.detail)) ? 'مقادیر ارسالی نامعتبر است'
          : esc((json && json.detail) || 'خطا');
        document.getElementById('msg').innerHTML = `<div class="alert alert-error">${t}</div>`;
        return;
      }
      localStorage.setItem('admin_token', json.access_token);
      // بازیابی امن: پس از ورود با رمز موقت، پنل مودال اجباری تغییر رمز را نشان می‌دهد
      if (json.must_change_password) {
        window.location.href = '/admin/panel#must-change';
      } else {
        window.location.href = '/admin/panel';
      }
    });
  </script>
  <footer class="mini-footer">
    <div class="container">
      <span>نوبتیار — سامانه نوبت‌دهی آنلاین شیراز</span>
      <span class="mini-links">
        <a href="https://shirazhealthtour.ir" dir="ltr">shirazhealthtour.ir</a>
        <a href="mailto:shiraznobatyar@gmail.com">ایمیل رسمی</a>
        <a href="https://t.me/shiraznobatyar" target="_blank" rel="noopener">تلگرام</a>
        <a href="https://eitaa.com/shiraznobatyar" target="_blank" rel="noopener">ایتا</a>
        <a href="https://rubika.ir/shiraznobatyar" target="_blank" rel="noopener">روبیکا</a>
        <a href="/contact">تماس با ما</a>
      </span>
    </div>
  </footer>
</body>
</html>
