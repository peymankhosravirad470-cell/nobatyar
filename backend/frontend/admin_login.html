<body>
  <header class="site-header site-header-v3">
    <div class="brand-band">
      <div class="container brand-band-inner">
        <a href="/" class="brand-lockup" aria-label="نوبتیار — صفحهٔ اصلی">

        </a>
        <div class="brand-band-cta">

        </div>

    </div>
    <div class="nav-band">
      <div class="container">
        <button type="button" class="nav-burger" aria-expanded="false" aria-controls="mainnav">
          <span></span><span></span><span></span>
          <span class="sr-only">باز و بسته کردن منو</span>
        </button>
        <nav class="main-nav" id="mainnav" aria-label="منوی اصلی">

        <a href="/register" class="nav-cta">ثبت‌نام مراکز</a>
        </nav>
      </div>
    </div>
  </header>
  <main class="container">
    <div class="card" style="max-width: 400px; margin: 2rem auto;">
      <h1>ورود ادمین</h1>
      <div id="msg"></div>
      <form id="loginForm">
        <label for="adminUser">نام کاربری</label>
        <input type="text" id="adminUser" name="username" required value="admin">
        <label for="adminPass">رمز عبور</label>
        <input type="password" id="adminPass" name="password" required>
        <button type="submit">ورود</button>
      </form>
    </div>
  </main>
  <script>
    // ضد XSS: جزئیات خطا هرگز مستقیم innerHTML نمی‌شود (v0.9.2)
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value })
      });
      const json = await res.json();
      if (!res.ok) {
        const t = (json && Array.isArray(json.detail)) ? 'مقادیر ارسالی نامعتبر است'
          : esc((json && json.detail) || 'خطا');
        document.getElementById('msg').innerHTML = `<div class="alert alert-error">${t}</div>`;
        return;
      }
      localStorage.setItem('admin_token', json.access_token);
      // بازیابی امن: پس از ورود با رمز موقت، پنل مودال اجباری تغییر رمز را نشان می‌دهد
      if (json.must_change_password) {
        window.location.href = '/admin/panel#must-change';
      } else {
        window.location.href = '/admin/panel';
      }
    });
  </script>
  <footer class="mini-footer">
    <div class="container">

        <a href="https://t.me/shiraznobatyar" target="_blank" rel="noopener">تلگرام</a>

        <a href="https://rubika.ir/shiraznobatyar" target="_blank" rel="noopener">روبیکا</a>
        <a href="/contact">تماس با ما</a>
      </span>
