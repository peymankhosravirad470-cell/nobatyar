<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام مطب | نوبتیار</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/favicon-256.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

  <!-- Google tag (gtag.js) — Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NVWBWMF1E4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NVWBWMF1E4');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand-inline" aria-label="نوبتیار — صفحهٔ اصلی"><picture><source type="image/webp" srcset="/static/img/nobatyar-mark.webp"><img src="/static/img/nobatyar-mark.png" alt="لوگوی رسمی نوبتیار" class="brand-mark"></picture><span class="brand-text"><b>نوبتیار</b><small>همراه هوشمند سلامت در شیراز</small></span></a>
      <input type="checkbox" id="navtg" class="nav-check" aria-hidden="true">
      <label for="navtg" class="nav-burger" aria-label="باز و بسته کردن منو"><span></span><span></span><span></span></label>
      <nav class="main-nav">
        <a href="/">خانه</a>
        <a href="/book">رزرو نوبت</a>
        <a href="/register">ثبت‌نام مطب</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card" style="max-width: 520px; margin: 2rem auto;">
      <h2>ثبت‌نام مطب / درمانگاه</h2>
      <p class="alert alert-info">
        پس از ثبت‌نام، ادمین درخواست شما را بررسی و تأیید می‌کند. سپس اطلاعات ورود به پنل برایتان ارسال می‌شود.
      </p>
      <div id="msg"></div>
      <form id="regForm">
        <label>نام مطب / درمانگاه</label>
        <input type="text" name="name" required placeholder="مثلاً مطب دکتر احمدی">

        <label>تخصص</label>
        <input type="text" name="specialty" required placeholder="مثلاً پوست و مو، دندانپزشکی، عمومی">

        <label>آدرس</label>
        <textarea name="address" rows="2" required placeholder="آدرس کامل در شیراز"></textarea>

        <label>شماره تماس</label>
        <input type="tel" name="phone" required placeholder="۰۷۱xxxxxxx یا ۰۹۱xxxxxxxx">

        <button type="submit">ارسال درخواست ثبت‌نام</button>
      </form>
    </div>
  </main>

  <script>
    // ---------- ضد XSS (اصلاح امنیتی v0.9.2) ----------
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    function _errHtml(json) {
      let t = 'خطا در ثبت';
      if (json && Array.isArray(json.detail)) t = 'مقادیر ارسالی نامعتبر است';
      else if (json && typeof json.detail === 'string') t = json.detail;
      return `<div class="alert alert-error">${esc(t)}</div>`;
    }

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        name: form.name.value.trim(),
        specialty: form.specialty.value.trim(),
        address: form.address.value.trim(),
        phone: form.phone.value.trim()
      };
      const msg = document.getElementById('msg');
      try {
        const res = await fetch('/api/clinics/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) {
          msg.innerHTML = _errHtml(json);
          return;
        }
        msg.innerHTML = `<div class="alert alert-success">درخواست شما با موفقیت ثبت شد (کد: ${json.id}). منتظر تأیید ادمین بمانید.</div>`;
        form.reset();
      } catch (err) {
        msg.innerHTML = `<div class="alert alert-error">خطای شبکه</div>`;
      }
    });
  </script>
</body>
</html>
