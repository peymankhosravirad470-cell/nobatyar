<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود مطب | نوبتیار</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/favicon-256.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/Vazirmatn-Regular.woff2?v=0111" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/style.css?v=0111">

  <!-- Google tag (gtag.js) — Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NVWBWMF1E4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NVWBWMF1E4');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand-inline" aria-label="نوبتیار — صفحهٔ اصلی"><picture><source type="image/webp" srcset="/static/img/nobatyar-mark.webp"><img src="/static/img/nobatyar-mark.png" alt="لوگوی رسمی نوبتیار" class="brand-mark"></picture><span class="brand-text"><b>نوبتیار</b><small>همراه هوشمند سلامت در شیراز</small></span></a>
      <nav><a href="/">خانه</a></nav>
    </div>
  </header>
  <main class="container">
    <div class="card" style="max-width: 400px; margin: 2rem auto;">
      <h1 style="margin-bottom:1rem;color:var(--primary);font-size:1.25rem;">ورود به پنل مطب</h1>
      <div id="msg"></div>
      <form id="loginForm">
        <label for="clinUser">نام کاربری</label>
        <input type="text" id="clinUser" name="username" required>
        <label for="clinPass">رمز عبور</label>
        <input type="password" id="clinPass" name="password" required>
        <button type="submit">ورود</button>
      </form>
    </div>
  </main>
  <script>
    // ضد XSS: جزئیات خطا هرگز مستقیم innerHTML نمی‌شود (v0.9.2)
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/api/clinic/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value, password: form.password.value })
      });
      const json = await res.json();
      const msg = document.getElementById('msg');
      if (!res.ok) {
        const t = (json && Array.isArray(json.detail)) ? 'مقادیر ارسالی نامعتبر است'
          : esc((json && json.detail) || 'خطا');
        msg.innerHTML = `<div class="alert alert-error">${t}</div>`;
        return;
      }
      localStorage.setItem('clinic_token', json.access_token);
      localStorage.setItem('clinic_info', JSON.stringify(json.clinic));
      window.location.href = '/clinic/panel';
    });
  </script>
  <footer class="mini-footer">
    <div class="container">
      <span>نوبتیار — سامانه نوبت‌دهی آنلاین شیراز</span>
      <span class="mini-links">
        <a href="https://shirazhealthtour.ir" dir="ltr">shirazhealthtour.ir</a>
        <a href="mailto:shiraznobatyar@gmail.com">ایمیل رسمی</a>
        <a href="https://t.me/shiraznobatyar" target="_blank" rel="noopener">تلگرام</a>
        <a href="https://eitaa.com/shiraznobatyar" target="_blank" rel="noopener">ایتا</a>
        <a href="https://rubika.ir/shiraznobatyar" target="_blank" rel="noopener">روبیکا</a>
        <a href="/contact">تماس با ما</a>
      </span>
    </div>
  </footer>
</body>
</html>
