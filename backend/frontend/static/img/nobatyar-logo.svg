<svg xmlns="http://www.w3.org/2000/svg" width="290" height="72" viewBox="0 0 290 72" role="img" aria-label="نوبتیار">
  <!-- نوبتیار — نشان کلمه‌ای (Wordmark). تا زمان ارائهٔ لوگوی رسمی توسط کارفرما استفاده می‌شود. -->
  <defs>
    <linearGradient id="nbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <!-- نشان: مربع گرد با نماد + پزشکی (سمت راست، مطابق چیدمان راست‌به‌چپ) -->
  <rect x="230" y="8" width="56" height="56" rx="14" fill="url(#nbGrad)"/>
  <rect x="252" y="19" width="12" height="34" rx="4" fill="#ffffff"/>
  <rect x="241" y="30" width="34" height="12" rx="4" fill="#ffffff"/>
  <!-- واژه‌نگار نوبتیار: متن راست‌به‌چپ، از لبهٔ راستِ ناحیهٔ متن به سمت چپ جاری می‌شود -->
  <text x="218" y="50" font-family="Vazirmatn, Tahoma, 'Segoe UI', sans-serif"
        font-size="36" font-weight="800" fill="#14355f"
        text-anchor="start" direction="rtl">نوبتیار</text>
</svg>
