<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رزرو نوبت | نوبتیار</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon-64.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/static/img/favicon-256.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

  <!-- Google tag (gtag.js) — Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NVWBWMF1E4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-NVWBWMF1E4');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="brand-inline" aria-label="نوبتیار — صفحهٔ اصلی"><picture><source type="image/webp" srcset="/static/img/nobatyar-mark.webp"><img src="/static/img/nobatyar-mark.png" alt="لوگوی رسمی نوبتیار" class="brand-mark"></picture><span class="brand-text"><b>نوبتیار</b><small>همراه هوشمند سلامت در شیراز</small></span></a>
      <input type="checkbox" id="navtg" class="nav-check" aria-hidden="true">
      <label for="navtg" class="nav-burger" aria-label="باز و بسته کردن منو"><span></span><span></span><span></span></label>
      <nav class="main-nav">
        <a href="/">خانه</a>
        <a href="/book">رزرو نوبت</a>
        <a href="/register">ثبت‌نام مطب</a>
        <a href="/contact">تماس با ما</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2>رزرو نوبت آنلاین</h2>
      <div id="msg"></div>

      <label>انتخاب مطب</label>
      <select id="clinicSelect">
        <option value="">— در حال بارگذاری —</option>
      </select>

      <div id="slotsSection" class="hidden">
      <div id="doctorBox" style="display:none; margin-bottom:1rem;">
        <label>پزشک</label>
        <select id="doctorSelect"><option value="">همهٔ پزشکان مرکز</option></select>
      </div>
        <label>اسلات‌های خالی</label>
        <div id="slotGrid" class="slot-grid"></div>
      </div>

      <div id="patientForm" class="hidden">
        <label>نام و نام خانوادگی بیمار</label>
        <input type="text" id="patientName" required>

        <label>شماره موبایل</label>
        <input type="tel" id="patientPhone" required placeholder="۰۹۱xxxxxxxx">

        <button id="bookBtn">ثبت نوبت</button>
      </div>
    </div>
  </main>

  <script>
    let selectedSlotId = null;
    let selectedClinicId = null;

    // ---------- ضد XSS (اصلاح امنیتی v0.9.2) ----------
    // جزئیات خطای سرور (مثلاً 422) می‌تواند شامل ورودی کاربر باشد؛ هرگز مستقیم innerHTML نمی‌رود.
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    function _errHtml(json) {
      let t = 'خطا';
      if (json && Array.isArray(json.detail)) t = 'مقادیر ارسالی نامعتبر است';
      else if (json && typeof json.detail === 'string') t = json.detail;
      return `<div class="alert alert-error">${esc(t)}</div>`;
    }

    async function loadClinics() {
      const res = await fetch('/api/clinics/public');
      const clinics = await res.json();
      const sel = document.getElementById('clinicSelect');
      sel.innerHTML = '<option value="">— انتخاب مطب —</option>';
      if (clinics.length === 0) {
        sel.innerHTML = '<option value="">هنوز مطب فعالی ثبت نشده</option>';
        return;
      }
      clinics.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.name} — ${c.specialty}`;
        sel.appendChild(opt);
      });
    }

    document.getElementById('clinicSelect').addEventListener('change', async (e) => {
      selectedClinicId = e.target.value;
      selectedSlotId = null;
      document.getElementById('patientForm').classList.add('hidden');
      const grid = document.getElementById('slotGrid');
      grid.innerHTML = '';
      if (!selectedClinicId) {
        document.getElementById('slotsSection').classList.add('hidden');
        return;
      }
      // v0.11: پر کردن انتخاب پزشک از پروفایل عمومی مرکز
      let docSel = document.getElementById('doctorSelect');
      const docBox = document.getElementById('doctorBox');
      try {
        const fr = await fetch(`/api/public/clinics/${selectedClinicId}/full`);
        if (fr.ok) {
          const full = await fr.json();
          const docs = full.doctors || [];
          docBox.style.display = docs.length ? '' : 'none';
          docSel.innerHTML = '<option value="">همهٔ پزشکان مرکز</option>' +
            docs.map(d => `<option value="${d.id}">${esc(d.full_name)} — ${esc(d.specialty)}</option>`).join('');
        } else { docBox.style.display = 'none'; }
      } catch (e) { docBox.style.display = 'none'; }
      await loadSlots();
    });

    async function loadSlots() {
      const selectedClinicId = document.getElementById('clinicSelect').value;
      const docId = document.getElementById('doctorSelect').value;
      const qp = docId ? `?doctor_id=${encodeURIComponent(docId)}` : '';
      const res = await fetch(`/api/public/clinics/${selectedClinicId}/slots${qp}`);
      const slots = await res.json();
      const grid = document.getElementById('slotGrid');
      grid.innerHTML = '';
      document.getElementById('slotsSection').classList.remove('hidden');
      if (slots.length === 0) {
        grid.innerHTML = '<p>اسلات خالی وجود ندارد.</p>';
        return;
      }
      slots.forEach(s => {
        const div = document.createElement('div');
        div.className = 'slot-item';
        const dt = new Date(s.start_datetime);
        div.textContent = dt.toLocaleString('fa-IR', { dateStyle: 'short', timeStyle: 'short' });
        div.dataset.id = s.id;
        div.onclick = () => {
          document.querySelectorAll('.slot-item').forEach(el => el.classList.remove('selected'));
          div.classList.add('selected');
          selectedSlotId = s.id;
          document.getElementById('patientForm').classList.remove('hidden');
        };
        grid.appendChild(div);
      });
    }

    document.getElementById('doctorSelect').addEventListener('change', () => {
      selectedSlotId = null;
      document.getElementById('patientForm').classList.add('hidden');
      loadSlots();
    });

    document.getElementById('bookBtn').addEventListener('click', async () => {
      const name = document.getElementById('patientName').value.trim();
      const phone = document.getElementById('patientPhone').value.trim();
      const msg = document.getElementById('msg');
      if (!name || !phone || !selectedSlotId || !selectedClinicId) {
        msg.innerHTML = '<div class="alert alert-error">همه فیلدها را پر کنید</div>';
        return;
      }
      const res = await fetch('/api/appointments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          clinic_id: parseInt(selectedClinicId),
          slot_id: parseInt(selectedSlotId),
          patient_name: name,
          patient_phone: phone,
          source: 'web'
        })
      });
      const json = await res.json();
      if (!res.ok) {
        msg.innerHTML = _errHtml(json);
        return;
      }
      msg.innerHTML = `<div class="alert alert-success">نوبت شما ثبت شد (کد: ${json.id}). وضعیت: در انتظار تأیید مطب</div>`;
      document.getElementById('patientForm').classList.add('hidden');
      // رفرش اسلات‌ها
      document.getElementById('clinicSelect').dispatchEvent(new Event('change'));
    });

    loadClinics();
  </script>
</body>
</html>
